apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-fe
  labels:
    app: test-fe
    dxp.io/managed: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-fe
  template:
    metadata:
      labels:
        app: test-fe
        backstage.io/kubernetes-id: test-fe
    spec:
      nodeSelector:
        role: workload
      tolerations:
      - key: role
        operator: Equal
        value: workload
        effect: NoSchedule
      containers:
      - name: test-fe
        image: harbor.harbor.svc.cluster.local/dxp/test-fe:687d0b1
        imagePullPolicy: Always
        envFrom:
        # S105 -- token renomme (etait PLACEHOLDER_DB_SECRET, majuscules
        # + underscore invalides pour un nom K8s -- RFC 1123 -- faisait
        # echouer la sync ArgoCD pour TOUT service sans BDD liee, y compris
        # ceux deja e2e-valides). Substitue par dxp-app-link-database.yaml
        # uniquement si un service-ref database est ajoute apres coup.
        - secretRef:
            name: placeholder-db-secret
            optional: true
        # S114 (L0a, #151) -- renseignee par dxp-app-update-manifest
        # (runtime-env) depuis le service-ref browser, vide si aucun
        # backend n'est lie. Lue au demarrage par docker/40-dxp-config.sh.
        env:
        - name: VITE_API_URL
          value: "https://atlas-avis-bff.68.221.5.247.nip.io:30444"
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: test-fe
spec:
  selector:
    app: test-fe
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-fe
  labels:
    app: test-fe
    dxp.io/managed: "true"
spec:
  ingressClassName: nginx
  # S91 -- tls: sans secretName ajoute (chantier retrait HTTP). Necessaire
  # pour que ssl-redirect=true (ConfigMap controleur ingress-nginx)
  # produise un effet reel : la fonction certificate_configured_for_current_request()
  # d'ingress-nginx (lua_ingress.lua) exige un cert explicitement enregistre
  # pour CE host precis avant d'autoriser la redirection HTTP->HTTPS -- le
  # default-ssl-certificate seul (dxp-platform-tls) ne suffit pas, meme s'il
  # sert bien de fallback pour le handshake TLS lui-meme. Verifie en
  # conditions reelles (S91, cristal-backend). Pas de secretName : continue
  # a utiliser le certificat par defaut du controleur, ce bloc sert
  # uniquement a enregistrer le host aupres du mecanisme de redirection.
  tls:
  - hosts:
    - test-fe.68.221.5.247.nip.io
  rules:
  - host: test-fe.68.221.5.247.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: test-fe
            port:
              number: 80
